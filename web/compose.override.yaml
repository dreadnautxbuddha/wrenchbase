---
services:
  web:
    image: ${WEB_DEV_IMAGE:-wrenchbase-web-dev}
    build:
      target: development
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    tty: true

volumes:
  web_node_modules:
  web_next:
